<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelCare - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
       .title-font { font-family: 'Outfit', sans-serif; }
       .glass { background: rgba(255,255,255,0.78); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.4); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative bg-[#0f172a]">
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1555854877-bab0e564b8d5?q=80&w=2069" class="w-full h-full object-cover opacity-50">
        <div class="absolute inset-0 bg-[#0f172a]/60"></div>
    </div>
    <div class="relative z-10 w-full max-w-[480px] glass rounded-[24px] shadow-2xl p-8 md:p-10">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-12 h-12 rounded-xl bg-[#1e3a8a] flex items-center justify-center text-white font-bold">H</div>
            <h1 class="title-font text-[30px] font-bold text-[#0f172a]">HostelCare</h1>
        </div>
        <h2 class="title-font text-[28px] font-bold text-[#1e293b]">Welcome back</h2>
        <p class="text-[14px] text-[#475569] mt-1 mb-7">Sign in to continue to your hostel stay</p>
        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="text-[13px] font-medium">Email</label>
                <input type="email" name="username" placeholder="you@example.com" required class="w-full h-[46px] mt-1.5 px-4 rounded-xl bg-white/70 border border-white/60 outline-none focus:bg-white focus:border-[#1e3a8a]">
            </div>
            <div>
                <label class="text-[13px] font-medium">Password</label>
                <input type="password" name="password" required class="w-full h-[46px] mt-1.5 px-4 rounded-xl bg-white/70 border border-white/60 outline-none focus:bg-white focus:border-[#1e3a8a]">
            </div>
            <div class="flex justify-between text-[13px] pt-1">
                <label class="flex gap-2 items-center"><input type="checkbox"> Remember me</label>
                <a href="#" class="text-[#1e3a8a] font-medium underline">Forgot password?</a>
            </div>
            <button type="submit" class="w-full h-[50px] rounded-xl bg-[#1e3a8a] hover:bg-[#1e40af] text-white font-semibold">Log in</button>
        </form>
        <p class="text-center text-[13px] mt-6">Don't have an account? <a th:href="@{/register}" class="font-semibold text-[#1e3a8a] underline">Sign up</a></p>
        <div class="mt-6 pt-4 border-t text-center text-[11px] text-gray-500">Secure login • Protected by SSL</div>
    </div>
</body>
</html>
